version: "1.0"

services:
  rust-mumble:
    name: rust-mumble
    repository: https://github.com/faroeste-studios/rust-mumble.git
    branch: main
    dockerfile: Dockerfile
    ports:
      - 30120:30120/tcp
      - 30120:30120/udp
    volumes:
      - rust_mumble_data:/app/data
    environment:
      # Exemplo de variável (caso precise)
      # RUST_LOG: info
    autodeploy: true
    restart_policy: always
    expose: true
    domain:
      enabled: false  # defina true se quiser HTTPS com domínio
      name: mumble.seudominio.com

volumes:
  rust_mumble_data:
    driver: local
